        content:
          application/json:
            schema:
              type: object
              required:
                - kind
                - status
              properties:
                kind:
                  type: string
                  enum: [company, person]
                status:
                  type: string
                  enum: [active, needs_review, archived, inactive]
                customer_number:
                  type: string
                  nullable: true
                company_number:
                  type: string
                  nullable: true
                registration_number:
                  type: string
                  nullable: true
                email_domains:
                  type: string
                  nullable: true
                  description: Comma-separated company domains used for affiliation matching.
                auto_assign_by_domain:
                  type: string
                  nullable: true
                  enum: [inherit, enabled, disabled]
              example:
                kind: company
                status: active
                display_name: Example GmbH
                legal_name: Example GmbH
                email: office@example.test
                phone: +43 1 234567
                profiles:
                  - customer
                idempotency_key: contact-create-example-gmbh-001
      parameters:
        - name: Content-Type
          in: header
          schema:
            type: string
          example: application/json
      responses:
