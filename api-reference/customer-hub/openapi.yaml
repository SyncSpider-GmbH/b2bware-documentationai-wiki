  /api/v1/apps/customer-hub/user-accounts/{account}/memberships:
    get:
      tags:
      - User Accounts
      summary: Index
      description: Admin-only. Requires Bearer authentication, admin.access, and permission:customer-hub.memberships.view.
        Archived memberships are hidden unless include_archived=true. Memberships grant user-account authorization; affiliations
        do not. Deactivate sets the membership inactive without archiving it. DELETE archives; restore reactivates; no hard-delete
        endpoint exists. Only one active default membership exists per user account. Validity windows require valid_until
        on or after valid_from. A missing user account is a domain failure and returns 422.  FormRequest validation and domain-invariant
        failures return 422 with a message or validation errors.
      parameters:
      - name: include_archived
        in: query
        schema:
          type: boolean
          default: false
        description: Include archived nested records; defaults to false.
        example: 'true'
      - name: account
        in: path
        schema:
          type: integer
        required: true
      responses:
        '200':
          description: Successful response
          content:
            application/json: {}
        '401':
          description: Missing or invalid Bearer token.
        '403':
          description: Admin access or the route-specific permission is missing.
        '422':
          description: FormRequest validation, missing user account/archived restore target, or another domain invariant failed.
      operationId: get_user_accounts_account_memberships
    post:
      tags:
      - User Accounts
      summary: Store
      description: Admin-only. Requires Bearer authentication, admin.access, and permission:customer-hub.memberships.create.
        Archived memberships are hidden unless include_archived=true. Memberships grant user-account authorization; affiliations
        do not. Deactivate sets the membership inactive without archiving it. DELETE archives; restore reactivates; no hard-delete
        endpoint exists. Only one active default membership exists per user account. Validity windows require valid_until
        on or after valid_from. A missing user account is a domain failure and returns 422.  FormRequest validation and domain-invariant
        failures return 422 with a message or validation errors.
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CompanyMembershipCreateRequest'
            example:
              company_contact_id: 2001
              role_id: 3
              status: active
              is_default: true
              valid_from: '2026-01-01'
      parameters:
      - name: Content-Type
        in: header
        schema:
          type: string
        example: application/json
      - name: account
        in: path
        schema:
          type: integer
        required: true
      responses:
        '201':
          description: Created.
