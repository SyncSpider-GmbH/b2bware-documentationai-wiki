openapi: 3.0.0
info:
  title: CustomerHub API
  description: 'CustomerHub API. All requests inherit Bearer authentication. Contact relationship endpoints are admin-only:
    they require auth:api, admin.access, and the exact permission named in each request. Missing/invalid credentials return
    401; authenticated non-admin callers or callers missing the route permission receive 403.'
  version: 1.0.0
servers:
- url: https://api.datahub.syncspider.com
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
  schemas:
    ContactInlineAddress:
      type: object
      properties:
        name:
          type: string
          maxLength: 255
          nullable: true
        company_name:
          type: string
          maxLength: 255
          nullable: true
        first_name:
          type: string
          maxLength: 255
          nullable: true
        last_name:
          type: string
          maxLength: 255
          nullable: true
        company_number:
          type: string
          maxLength: 255
          nullable: true
        email:
          type: string
          format: email
          maxLength: 255
          nullable: true
        phone:
          type: string
          maxLength: 100
          nullable: true
        website:
          type: string
          maxLength: 255
          nullable: true
        address_line_1:
          type: string
          maxLength: 255
          nullable: true
        address_line_2:
          type: string
          maxLength: 255
          nullable: true
        city:
          type: string
          maxLength: 255
          nullable: true
        zip:
          type: string
          maxLength: 50
          nullable: true
        state:
          type: string
          maxLength: 255
          nullable: true
        country:
          type: string
          minLength: 2
          maxLength: 2
          description: ISO 3166-1 alpha-2 country code.
          nullable: true
        vat_number:
          type: string
          maxLength: 255
          nullable: true
        registration_number:
          type: string
          maxLength: 255
          nullable: true
    ContactAddressCreateRequest:
      type: object
      required:
      - purpose
      properties:
        address_id:
          type: integer
          nullable: true
        address:
          $ref: '#/components/schemas/ContactInlineAddress'
          nullable: true
        purpose:
          type: string
          enum:
          - billing
          - shipping
          - registered
          - legal
          - delivery
          - office
          - other
        is_default:
          type: boolean
        status:
          type: string
          enum:
          - active
          - inactive
          - archived
        valid_from:
          type: string
          format: date
          nullable: true
        valid_until:
          type: string
          format: date
          description: Must be on or after valid_from.
          nullable: true
        legacy_type:
          type: string
          enum:
          - billing_address
          - shipping_address
          description: Must be supplied with legacy_id. Billing requires purpose=billing; shipping requires purpose=shipping
            or delivery.
          nullable: true
        legacy_id:
          type: integer
          minimum: 1
          nullable: true
      oneOf:
      - required:
        - address_id
      - required:
        - address
      description: Provide exactly one of address_id or address. legacy_type and legacy_id must be supplied together.
    ContactAddressUpdateRequest:
      type: object
      properties:
        address_id:
          type: integer
        address:
          $ref: '#/components/schemas/ContactInlineAddress'
        purpose:
          type: string
          enum:
          - billing
          - shipping
          - registered
          - legal
          - delivery
          - office
          - other
        is_default:
          type: boolean
        status:
          type: string
          enum:
          - active
          - inactive
          - archived
        valid_from:
          type: string
          format: date
          nullable: true
        valid_until:
          type: string
          format: date
          description: Must be on or after valid_from.
          nullable: true
      description: Partial updates are accepted by both PUT and PATCH. legacy_type and legacy_id are prohibited on update.
    CompanyAffiliationCreateRequest:
      type: object
      required:
      - company_contact_id
      properties:
        company_contact_id:
          type: integer
        type:
          type: string
          maxLength: 100
        status:
          type: string
          enum:
          - active
          - inactive
          - archived
        valid_from:
          type: string
          format: date
          nullable: true
        valid_until:
          type: string
          format: date
          description: Must be on or after valid_from.
          nullable: true
        is_primary:
          type: boolean
        mirror_legacy_company:
          type: boolean
    CompanyAffiliationUpdateRequest:
      type: object
      properties:
        company_contact_id:
          type: integer
        type:
          type: string
          maxLength: 100
        status:
          type: string
          enum:
          - active
          - inactive
          - archived
        valid_from:
          type: string
          format: date
          nullable: true
        valid_until:
          type: string
          format: date
          description: Must be on or after valid_from.
          nullable: true
        is_primary:
          type: boolean
        mirror_legacy_company:
          type: boolean
    CompanyMembershipCreateRequest:
      type: object
      required:
      - company_contact_id
      properties:
        company_contact_id:
          type: integer
        role_id:
          type: integer
          nullable: true
        status:
          type: string
          enum:
          - active
          - inactive
        is_default:
          type: boolean
        valid_from:
          type: string
          format: date
          nullable: true
        valid_until:
          type: string
          format: date
          description: Must be on or after valid_from.
          nullable: true
    CompanyMembershipUpdateRequest:
      type: object
      properties:
        company_contact_id:
          type: integer
        role_id:
          type: integer
          nullable: true
        status:
          type: string
          enum:
          - active
          - inactive
        is_default:
          type: boolean
        valid_from:
          type: string
          format: date
          nullable: true
        valid_until:
          type: string
          format: date
          description: Must be on or after valid_from.
          nullable: true
    ContactNoteMutationRequest:
      type: object
      required:
      - note
      properties:
        note:
          type: string
        legacy_type:
          type: string
          enum:
          - customer
          - company
          description: Optional compatibility target for mapped legacy notes.
    ContactUpsertRequest:
      type: object
      required:
      - kind
      - status
      - display_name
      properties:
        kind:
          type: string
          enum:
          - company
          - person
        status:
          type: string
          enum:
          - active
          - needs_review
          - archived
          - inactive
        display_name:
          type: string
          maxLength: 255
        legal_name:
          type: string
          maxLength: 255
          nullable: true
        company_name:
          type: string
          maxLength: 255
          nullable: true
        salutation:
          type: string
          maxLength: 50
          nullable: true
        title:
          type: string
          maxLength: 100
          nullable: true
        first_name:
          type: string
          maxLength: 255
          nullable: true
        last_name:
          type: string
          maxLength: 255
          nullable: true
        email:
          type: string
          format: email
          maxLength: 255
          nullable: true
        phone:
          type: string
          maxLength: 100
          nullable: true
        language_code:
          type: string
          maxLength: 20
          nullable: true
        profiles:
          type: array
          maxItems: 10
          items:
            type: string
            minLength: 1
            maxLength: 100
          description: Distinct profile names to enable. Omitted profiles remain enabled on update.
        idempotency_key:
          type: string
          minLength: 8
          maxLength: 255
          description: Tenant-scoped retry key for resumable Contact creation.
        identifiers:
          type: array
          maxItems: 50
          items:
            type: object
            required:
            - type
            - value
            properties:
              type:
                type: string
                maxLength: 100
              value:
                type: string
                maxLength: 255
              issuer:
                type: string
                maxLength: 100
                nullable: true
              is_primary:
                type: boolean
                nullable: true
      description: id and create_user_account are prohibited. Companies require legal_name or company_name; people require
        first_name or last_name.
