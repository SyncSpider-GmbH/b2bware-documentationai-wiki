  /api/v1/apps/customer-hub/contacts/{contact}/addresses:
    get:
      tags:
      - Contacts
      summary: Index
      description: 'Admin-only. Requires Bearer authentication, admin.access, and permission:customer-hub.contact-addresses.view.
        Archived links are hidden unless include_archived=true. DELETE archives; restore reactivates; no hard-delete endpoint
        exists. Only one active default exists per contact and purpose. Valid purposes are billing, shipping, registered,
        legal, delivery, office, and other. Create accepts exactly one of address_id or inline address. Legacy mapping requires
        both legacy_type and legacy_id; billing_address requires billing, while shipping_address requires shipping or delivery.
        Example alternatives: existing link {"address_id":42,"purpose":"office"}; legacy billing {"address_id":42,"purpose":"billing","legacy_type":"billing_address","legacy_id":7};
        legacy shipping {"address_id":43,"purpose":"delivery","legacy_type":"shipping_address","legacy_id":8}. Additional
        valid purpose examples: {"address_id":44,"purpose":"registered"}, {"address_id":45,"purpose":"legal"}, {"address_id":46,"purpose":"shipping"},
        and {"address_id":47,"purpose":"other"}. A missing parent Contact or active nested record returns 404.'
      parameters:
      - name: include_archived
        in: query
        schema:
          type: boolean
          default: false
        description: Include archived nested records; defaults to false.
        example: 'true'
      - name: contact
        in: path
        schema:
          type: integer
        required: true
      responses:
        '200':
          description: Successful response
          content:
            application/json: {}
        '401':
          description: Missing or invalid Bearer token.
        '403':
          description: Admin access or the route-specific permission is missing.
        '404':
          description: The parent Contact/user account or nested relationship was not found.
      operationId: get_contacts_contact_addresses
    post:
      tags:
      - Contacts
      summary: Store
      description: 'Admin-only. Requires Bearer authentication, admin.access, and permission:customer-hub.contact-addresses.create.
        Archived links are hidden unless include_archived=true. DELETE archives; restore reactivates; no hard-delete endpoint
        exists. Only one active default exists per contact and purpose. Valid purposes are billing, shipping, registered,
        legal, delivery, office, and other. Create accepts exactly one of address_id or inline address. Legacy mapping requires
        both legacy_type and legacy_id; billing_address requires billing, while shipping_address requires shipping or delivery.
        Example alternatives: existing link {"address_id":42,"purpose":"office"}; legacy billing {"address_id":42,"purpose":"billing","legacy_type":"billing_address","legacy_id":7};
        legacy shipping {"address_id":43,"purpose":"delivery","legacy_type":"shipping_address","legacy_id":8}. Additional
        valid purpose examples: {"address_id":44,"purpose":"registered"}, {"address_id":45,"purpose":"legal"}, {"address_id":46,"purpose":"shipping"},
        and {"address_id":47,"purpose":"other"}. A missing parent Contact or active nested record returns 404. FormRequest
        validation and domain-invariant failures return 422 with a message or validation errors.'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ContactAddressCreateRequest'
            example:
              address:
                name: Vienna billing office
                company_name: Example GmbH
                email: office@example.test
                phone: +43 1 234567
                address_line_1: Mariahilfer Strasse 1
                city: Vienna
                zip: '1060'
                state: Vienna
                country: AT
                vat_number: ATU12345678
              purpose: billing
              is_default: true
              status: active
              valid_from: '2026-01-01'
      parameters:
      - name: Content-Type
        in: header
        schema:
          type: string
        example: application/json
      - name: contact
        in: path
        schema:
          type: integer
        required: true
      responses:
        '201':
          description: Created.
          content:
            application/json: {}
        '401':
          description: Missing or invalid Bearer token.
        '403':
          description: Admin access or the route-specific permission is missing.
        '404':
          description: The parent Contact/user account or nested relationship was not found.
        '422':
          description: FormRequest validation, missing user account/archived restore target, or another domain invariant failed.
      operationId: post_contacts_contact_addresses
  /api/v1/apps/customer-hub/contacts/{contact}/addresses/{link}:
    get:
      tags:
      - Contacts
