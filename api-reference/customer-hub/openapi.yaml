              legal_name: Example GmbH
              email: office@example.test
              phone: +43 1 234567
              profiles:
              - customer
              idempotency_key: contact-create-example-gmbh-001
      parameters:
      - name: Content-Type
        in: header
        schema:
          type: string
        example: application/json
      responses:
        '201':
          description: Contact created.
          content:
            application/json: {}
        '422':
