  /api/v1/apps/customer-hub/contacts/{contact}/affiliation-candidates:
    get:
      tags:
        - Contacts
      summary: Affiliation Candidates
      description: Returns active, unassigned person Contacts whose non-public
        email domain matches the company. Suggestions and automatic assignment
        create affiliations only, never authorization memberships.
      parameters:
        - name: contact
          in: path
          schema:
            type: string
          required: true
      responses:
        '200':
          description: Matching people
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  properties:
                    id:
                      type: integer
                    display_name:
                      type: string
                    email:
                      type: string
                      nullable: true
                    matched_domain:
                      type: string
        '404':
          description: Contact not found.
        '422':
          description: The Contact is not a company.
