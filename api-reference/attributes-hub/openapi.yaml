  /api/v1/apps/attributes-hub/attributes/insert/bulk:
    put:
      tags:
        - Attributes
      summary: Bulk Insert Attributes
      description: >-
        Bulk insert. Each attribute supports `use_in_checkout` (storefront
        checkout exposure for `group.type='order'` attributes) and
        `use_for_sorting` (dynamic API ?sort=<attribute_code> on the relevant
        listing endpoint(s)).
      requestBody:
        content:
          application/json:
            schema:
              type: object
              example:
                attributes:
                  - name: PO Number
                    attribute_code: po_number
                    type: text
                    group_id: 5
                    required: true
                    position: 1
                    used_for_filtering: false
                    visible_on_the_product_page: false
                    filterable_with_results: false
                    use_in_notifications: false
                    use_in_checkout: true
                    use_for_sorting: true
                  - name: Internal Note
                    attribute_code: internal_note
                    type: text
                    group_id: 5
                    required: true
                    position: 1
                    used_for_filtering: false
                    visible_on_the_product_page: false
                    filterable_with_results: false
                    use_in_notifications: false
                    use_in_checkout: false
                    use_for_sorting: false
      parameters:
        - name: Accept
          in: header
          schema:
            type: string
          example: application/json
        - name: Content-Type
          in: header
          schema:
            type: string
          example: application/json
      responses:
        '200':
          description: Successful response
          content:
            application/json: {}
