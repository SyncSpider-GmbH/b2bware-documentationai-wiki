  /api/v1/apps/attributes-hub/sortable-attributes/1/resync:
    post:
      tags:
        - Sortable Attributes
      summary: Resync Sortable Attribute
      description: >-
        Queue a background backfill that resyncs the denormalized
        sort/admin-filter values for a single attribute (path param
        `attribute_id`). The attribute must have `use_for_sorting` or
        `use_for_admin_filtering` enabled (otherwise 422); unknown id returns
        404. Admin-only. Returns 202 immediately; progress is tracked through
        the SettingsHub index dashboard.
      requestBody:
        content: {}
      parameters:
