  /api/v1/apps/attributes-hub/sortable-attributes/resync:
    post:
      tags:
        - Sortable Attributes
      summary: Resync All Sortable Attributes
      description: >-
        Queue a background backfill that resyncs the denormalized
        sort/admin-filter values for every attribute with `use_for_sorting` or
        `use_for_admin_filtering` enabled. Admin-only. Returns 202 immediately;
        progress is tracked through the SettingsHub index dashboard (`GET
        /api/v1/apps/settings-hub/index`, rows of
        `type=sortable_attribute_sync`).
      requestBody:
        content: {}
      parameters:
        - name: Accept
          in: header
          schema:
            type: string
          example: application/json
        - name: Content-Type
          in: header
          schema:
