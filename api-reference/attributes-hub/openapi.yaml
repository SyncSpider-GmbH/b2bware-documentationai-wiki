openapi: 3.0.0
info:
  title: AttributesHub API
  description: >-
    Complete API collection for AttributesHub — attribute definitions, values,
    groups, and attributable value assignments.
  version: 1.0.0
servers:
  - url: https://api.datahub.syncspider.com
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
security:
  - bearerAuth: []
tags:
  - name: Attributes
  - name: Attribute Values
  - name: Attribute Groups
  - name: Attributable Values
  - name: Sortable Attributes
paths:
  /api/v1/apps/attributes-hub/attributes:
    get:
      tags:
        - Attributes
      summary: List Attributes
      parameters:
        - name: Accept
          in: header
          schema:
            type: string
          example: application/json
      responses:
        '200':
          description: Successful response
          content:
            application/json: {}
    post:
      tags:
        - Attributes
      summary: Create Attribute
      description: >-
        Create an Attribute. Set `use_in_checkout=true` (when
        group.type='order') to expose this attribute on the OrderHub storefront
        checkout. Set `use_for_sorting=true` to make this attribute valid as
        `?sort=<attribute_code>` on every listing endpoint whose target's
        group_types include this attribute's group type. See
        packages/Apps/OrderHub/CHECKOUT.md.
      requestBody:
        content:
          application/json:
            schema:
              type: object
              example:
                name: PO Number
                attribute_code: po_number
                type: text
                group_id: 5
                required: true
                position: 1
                used_for_filtering: false
                visible_on_the_product_page: false
                filterable_with_results: false
                use_in_notifications: false
                use_in_checkout: true
                use_for_sorting: true
      parameters:
        - name: Accept
          in: header
          schema:
            type: string
          example: application/json
        - name: Content-Type
          in: header
          schema:
            type: string
          example: application/json
      responses:
        '200':
          description: Successful response
          content:
            application/json: {}
  /api/v1/apps/attributes-hub/attributes/1:
    get:
      tags:
        - Attributes
      summary: Get Attribute
      parameters:
        - name: Accept
          in: header
          schema:
            type: string
          example: application/json
      responses:
        '200':
          description: Successful response
          content:
            application/json: {}
    put:
      tags:
        - Attributes
      summary: Update Attribute
      description: >-
        Update an Attribute. `use_in_checkout` toggles storefront-checkout
        exposure (only meaningful when group.type='order'). `use_for_sorting`
        toggles dynamic API ?sort=<attribute_code> on the relevant listing
        endpoint(s).
      requestBody:
        content:
          application/json:
            schema:
              type: object
              example:
                name: PO Number
                group_id: 5
                required: true
                position: 1
                used_for_filtering: false
                visible_on_the_product_page: false
                filterable_with_results: false
                use_in_notifications: false
                use_in_checkout: true
                use_for_sorting: true
      parameters:
        - name: Accept
          in: header
          schema:
            type: string
          example: application/json
        - name: Content-Type
          in: header
          schema:
            type: string
          example: application/json
      responses:
        '200':
          description: Successful response
          content:
            application/json: {}
    delete:
      tags:
        - Attributes
      summary: Delete Attribute
      parameters:
        - name: Accept
          in: header
          schema:
            type: string
          example: application/json
      responses:
        '200':
          description: Successful response
          content:
            application/json: {}
