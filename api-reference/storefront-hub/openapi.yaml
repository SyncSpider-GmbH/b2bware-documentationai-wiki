          content:
            application/json: {}
  /api/v1/apps/storefront-hub/url-rewrites/generate-paths:
    post:
      tags:
        - Url Rewrites
      summary: Generate missing SEO paths
      description: >
        Fills empty product seo.slug, category seo.slug, and Builder page url_key from
        name/title (kebab-case). Collisions use {base}-{id}. Does not overwrite existing
        paths. First product slug also records a 301 from products/{id} to products/{slug}.
      responses:
        '200':
          description: Summary of updated/skipped counts per entity type
          content:
            application/json: {}
