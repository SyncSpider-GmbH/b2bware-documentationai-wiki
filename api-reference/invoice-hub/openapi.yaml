        '200':
          description: Successful response
          content:
            application/json: {}
  /api/v1/apps/invoice-hub/settings/reset:
    post:
      tags:
        - Settings
      summary: Reset settings
      requestBody:
        content: {}
      parameters:
        - name: installation-key
          in: header
          schema:
            type: string
          example: '{{installation_key}}'
      responses:
        '200':
          description: Successful response
          content:
