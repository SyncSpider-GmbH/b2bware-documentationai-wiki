openapi: 3.0.0
info:
  title: SubscriptionHub API
  description: Complete API collection for SubscriptionHub — generated from routes/api.php
  version: 1.0.0
servers:
  - url: https://api.datahub.syncspider.com
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
security:
  - bearerAuth: []
tags:
  - name: Carts
  - name: Interval Units
  - name: Product Settings
  - name: Renewal Payment
  - name: Settings
  - name: Subscription History
  - name: Subscriptions
paths:
  /api/v1/apps/subscription-hub/carts/{cart}/subscription-checkout:
    post:
      tags:
        - Carts
      summary: Checkout
      description: >-
        Signed-in storefront customers only. Subscribe to the single line of the
        caller's own active cart and place the first order.
      requestBody:
        content:
          application/json:
            schema:
              type: object
              example:
                interval:
                  unit: month
                  count: 1
                billing_method_id: 3
                shipping_method_id: 2
                billing_address_id: 11
                shipping_address_is_same_as_billing: true
                billing_method:
                  redirect_url: https://shop.example.com/account/orders
                  save_payment_method: true
                comment: null
      parameters:
        - name: Content-Type
          in: header
          schema:
            type: string
          example: application/json
        - name: cart
          in: path
          schema:
            type: string
          required: true
      responses:
        '200':
          description: Successful response
          content:
            application/json: {}
