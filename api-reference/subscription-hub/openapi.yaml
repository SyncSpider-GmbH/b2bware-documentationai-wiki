  /api/v1/apps/subscription-hub/renewal-payment/{installationKey}/{order}:
    get:
      security: []
      tags:
        - Renewal Payment
      summary: Pay
      description: >-
        Public, signed link emailed for unpaid renewals (query parameters
        `expires` and `signature`); expires at the payment deadline. Redirects
        (302) to the payment provider. No bearer token.
      parameters:
        - name: installationKey
          in: path
          schema:
            type: string
          required: true
        - name: order
          in: path
          schema:
            type: string
          required: true
      responses:
        '200':
          description: Successful response
          content:
            application/json: {}
