        - Interval Units
      summary: Show
      parameters:
        - name: id
          in: path
          schema:
            type: string
          required: true
      responses:
        '200':
          description: Successful response
          content:
            application/json: {}
    put:
      tags:
        - Interval Units
      summary: Update
      requestBody:
        content:
          application/json:
            schema:
              type: object
              example:
                code: quarter
                name: Quarter
                active: true
      parameters:
        - name: Content-Type
          in: header
          schema:
            type: string
          example: application/json
        - name: id
          in: path
          schema:
