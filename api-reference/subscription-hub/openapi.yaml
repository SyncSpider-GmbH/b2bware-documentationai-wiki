  /api/v1/apps/subscription-hub/subscriptions/{id}/pause:
    post:
      tags:
        - Subscriptions
      summary: Pause
      description: >-
        Pause. No renewals until resumed; resuming moves the next due date by
        the paused time. Optional reason (max 500 chars) is stored in the
        history.
      requestBody:
        content:
          application/json:
            schema:
              type: object
              example:
                reason: Customer is on holiday
      parameters:
