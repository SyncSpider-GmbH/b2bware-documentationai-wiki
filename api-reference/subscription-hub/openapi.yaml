      tags:
        - Subscriptions
      summary: End
      description: >-
        End immediately (terminal). Optional reason (max 500 chars) is stored in
        the history.
      requestBody:
        content:
          application/json:
            schema:
              type: object
              example:
                reason: Customer is on holiday
      parameters:
        - name: Content-Type
