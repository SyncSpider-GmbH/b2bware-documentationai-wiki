openapi: 3.0.0
info:
  title: MediaHub
  description: >-
    Public media CDN proxy for B2Bware DataHub.


    MediaHub exposes a single unauthenticated CDN endpoint mounted at the root
    path. The `:domain` segment is a fully qualified hostname (e.g.
    `gogatec.com`) and `:path` is the object path inside the configured storage
    backend. Media URLs returned by other hubs (`mainMedia.media_url`,
    `gallery[].media_url`) already point here; storefronts usually consume those
    URLs directly rather than calling this themselves.
  version: 1.0.0
servers:
  - url: https://api.datahub.syncspider.com
tags:
  - name: CDN
    description: Public media delivery — no authentication, no headers required.
paths:
  /cdn/:domain/:path:
    get:
      tags:
        - CDN
      summary: Fetch Media Asset
      description: >-
        Returns the raw media bytes. Resize/format variants (if enabled by the
        installation) are encoded into the `:path` segment.


        Cacheable on any standard CDN — responses include long `Cache-Control`
        headers and are identical regardless of caller.
      parameters:
        - name: Accept
          in: header
          schema:
            type: string
          example: application/json
      responses:
        '200':
          description: Successful response
          content:
            application/json: {}
