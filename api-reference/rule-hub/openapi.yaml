      summary: Index
      responses:
        '200':
          description: Successful response
          content:
            application/json: {}
    post:
      tags:
        - Cart Price Rules
      summary: Store
      requestBody:
        content:
          application/json:
            schema:
              type: object
              example:
                name: 5p/Litre Discount – 540L+ Threshold
                description: 5p per litre discount when total litres >= 540
                status: active
                priority: 10
                conditions:
                  type: combine
                  operator: all
                  conditions:
                    - type: cart_items_aggregate
                      source: product_custom_attribute
                      attribute: weight
                      aggregate: sum
                      quantity_aware: true
                      operator: '>='
                      value: 540
                action_type: per_unit_attribute_fixed
                action_amount: 0.05
                action_attribute: weight
                action_attribute_source: product_custom_attribute
                free_shipping: 'no'
                stop_further_rules: false
      parameters:
        - name: Content-Type
          in: header
          schema:
            type: string
          example: application/json
      responses:
        '200':
          description: Successful response
          content:
            application/json: {}
