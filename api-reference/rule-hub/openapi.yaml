      summary: Index
      responses:
        '200':
          description: Successful response
          content:
            application/json: {}
    post:
      tags:
        - Cart Validation Rules
      summary: Store
      requestBody:
        content:
          application/json:
            schema:
              type: object
              example:
                name: Bulk vs Standard Mutual Exclusion
                description: Cannot mix Bulk and Standard Aspen fuel products
                status: active
                constraint_type: mutual_exclusion
                group_a:
                  type: combine
                  operator: all
                  conditions:
                    - type: attribute
                      target: product
                      attribute: sku
                      operator: contains
                      value: BULK
                group_b:
                  type: combine
                  operator: all
                  conditions:
                    - type: attribute
                      target: product
                      attribute: sku
                      operator: contains
                      value: STD
                error_message: Cannot mix Bulk and Standard fuel products in the same cart
      parameters:
        - name: Content-Type
          in: header
          schema:
            type: string
          example: application/json
      responses:
