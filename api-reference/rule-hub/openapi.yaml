    post:
      tags:
        - Catalog Price Rules
      summary: Store
      requestBody:
        content:
          application/json:
            schema:
              type: object
              example:
                name: VIP Customer – 15% off SKU 5875
                description: 15% discount for VIP customers on product SKU 5875
                status: active
                priority: 10
                conditions:
                  type: combine
                  operator: all
                  conditions:
                    - type: attribute
                      target: product
                      attribute: sku
                      operator: '=='
                      value: '5875'
                    - type: attribute
                      target: customer
                      attribute: customer_group_id
                      operator: '=='
                      value: '1'
                action_type: by_percent
                action_amount: 15
                customer_group_ids:
                  - 1
                stop_further_rules: false
                date_from: null
                date_to: null
      parameters:
        - name: Content-Type
          in: header
