openapi: 3.0.0
info:
  title: ProcurementHub API
  description: Complete ProcurementHub API collection generated from package routes.
  version: 1.0.0
servers:
  - url: https://api.datahub.syncspider.com
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
security:
  - bearerAuth: []
tags:
  - name: Suppliers
  - name: Purchase orders
  - name: Goods receipts
  - name: Vendor bills
paths:
  /api/v1/apps/procurement-hub/suppliers/statuses/list:
    get:
      tags:
        - Suppliers
      summary: Supplier statuses
      parameters:
        - name: installation-key
          in: header
          schema:
            type: string
          example: '{{installation_key}}'
      responses:
        '200':
          description: Successful response
          content:
            application/json: {}
  /api/v1/apps/procurement-hub/suppliers:
    get:
      tags:
        - Suppliers
      summary: List suppliers
      parameters:
        - name: installation-key
          in: header
          schema:
            type: string
          example: '{{installation_key}}'
        - name: page
          in: query
          schema:
            type: integer
          example: '1'
        - name: per_page
          in: query
          schema:
            type: integer
          example: '25'
      responses:
        '200':
          description: Successful response
          content:
            application/json: {}
    post:
      tags:
        - Suppliers
      summary: Create supplier
      requestBody:
        content:
          application/json:
            schema:
              type: object
              example:
                supplier_number: SUP-001
                name: Example Supplier
                currency: EUR
      parameters:
        - name: installation-key
          in: header
          schema:
            type: string
          example: '{{installation_key}}'
        - name: Content-Type
          in: header
          schema:
            type: string
