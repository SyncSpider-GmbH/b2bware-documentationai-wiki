  /api/v1/apps/procurement-hub/purchase-orders:
    get:
      tags:
        - Purchase orders
      summary: List purchase orders
      parameters:
        - name: installation-key
          in: header
          schema:
            type: string
          example: '{{installation_key}}'
        - name: include
          in: query
          schema:
            type: string
          example: supplier,lineItems,goodsReceipts
        - name: page
          in: query
          schema:
            type: integer
          example: '1'
        - name: per_page
          in: query
          schema:
            type: integer
          example: '25'
      responses:
        '200':
          description: Successful response
          content:
            application/json: {}
    post:
      tags:
        - Purchase orders
      summary: Create purchase order
      requestBody:
        content:
          application/json:
            schema:
              type: object
              example:
                supplier_id: 1
                contact_id: 201
                counterparty_snapshot:
                  name: Example Supplier GmbH
                  vat_id: ATU87654321
                department_ids:
                  - 3
                currency: EUR
                line_items:
                  - description: Office chairs
                    sku: CHAIR-1
                    quantity: 4
                    unit_price: 100
                    tax_rate: 20
      parameters:
        - name: installation-key
          in: header
          schema:
            type: string
          example: '{{installation_key}}'
        - name: Content-Type
          in: header
          schema:
            type: string
          example: application/json
      responses:
        '200':
          description: Successful response
          content:
            application/json: {}
