            type: string
          required: true
      responses:
        '200':
          description: Successful response
          content:
            application/json: {}
    put:
      tags:
        - Purchase orders
      summary: Update purchase order
      requestBody:
        content:
          application/json:
            schema:
              type: object
              example:
                expected_date: '2026-09-01'
      parameters:
        - name: installation-key
          in: header
          schema:
            type: string
          example: '{{installation_key}}'
        - name: Content-Type
          in: header
          schema:
            type: string
