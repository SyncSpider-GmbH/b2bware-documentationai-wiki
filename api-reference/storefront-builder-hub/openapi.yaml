  /api/v1/apps/storefront-builder-hub/related-content/{source}/{recordId}/entry:
    patch:
      tags:
        - Content relationships
      summary: Edit an entry from a related record
      description: >-
        Applies allowed editable fields for the current association. Use mode
        inline to enforce the configured inline-edit setting, or lightbox for
        standard editor access. Link changes use link, replace or unlink
        instead.
      requestBody:
        content:
          application/json:
            schema:
              type: object
              example:
                type: product-guides
                field: related_product
                entry: 64cae4a66bf894c4e3c12074
                mode: inline
                values:
                  title: Updated guide
      parameters:
        - name: Content-Type
          in: header
          schema:
            type: string
          example: application/json
        - name: source
          in: path
          schema:
            type: string
          required: true
        - name: recordId
          in: path
          schema:
            type: string
          required: true
      responses:
        '200':
          description: "OK"
          content:
            application/json:
