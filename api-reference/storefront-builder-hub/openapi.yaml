  /api/v1/apps/storefront-builder-hub/related-content/{source}/{recordId}:
    get:
      tags:
        - Content relationships
      summary: List related content for a record
      description: >-
        With no type, list eligible Content Types and use their next ID as
        after. With a type ID or slug, list linked entries and use their next
        cursor as before. Entries can be searched by title or slug using q and
        filtered by supplying both the category field code and configured
        category slug. For type discovery, q searches type labels. Related
        entries include scoped structured details and capabilities. Required
        relationships cannot be left empty.
      parameters:
        - name: after
          in: query
          schema:
            type: integer
          example: '0'
        - name: type
          in: query
          schema:
            type: integer
          example: '1'
        - name: before
          in: query
          schema:
            type: string
          example: 64cae4a66bf894c4e3c12074
        - name: q
          in: query
          schema:
            type: string
          example: Guide
        - name: category_field
          in: query
          schema:
            type: string
          example: topic
        - name: category
          in: query
          schema:
            type: string
          example: setup
        - name: source
          in: path
          schema:
            type: string
          required: true
        - name: recordId
          in: path
          schema:
            type: string
          required: true
      responses:
        '200':
          description: Successful response
          content:
            application/json: {}
  /api/v1/apps/storefront-builder-hub/related-content/{source}/{recordId}/link-options:
    get:
      tags:
        - Content relationships
      summary: Search entries eligible to link
      description: >-
        Finds entries of the selected Content Type and relationship field by
        title or slug. The target source and entry update permission are
        required. The selected relationship must have capacity for this record.
        Set include_unavailable=1 to keep readable unavailable matches with
        unavailable_reason: already_linked, target_in_use, relationship_full, or
        restricted.
      parameters:
        - name: type
          in: query
          schema:
            type: string
          example: product-guides
        - name: field
          in: query
          schema:
            type: string
          example: related_product
        - name: q
          in: query
          schema:
            type: string
          example: Guide
        - name: page
          in: query
          schema:
            type: integer
          example: '1'
        - name: include_unavailable
          in: query
          schema:
            type: integer
          example: '1'
        - name: source
          in: path
          schema:
            type: string
          required: true
        - name: recordId
          in: path
          schema:
            type: string
          required: true
      responses:
        '200':
          description: Successful response
          content:
            application/json: {}
  /api/v1/apps/storefront-builder-hub/related-content/{source}/{recordId}/link:
    post:
      tags:
        - Content relationships
      summary: Link an existing content entry
      description: >-
        Adds this record to the selected relationship. A repeat of the same
        assignment returns success. Existing targets remain in place. An
        occupied single-record field or a full list returns 409.
      requestBody:
        content:
          application/json:
            schema:
              type: object
              example:
                type: product-guides
                field: related_product
                entry: 64cae4a66bf894c4e3c12074
      parameters:
        - name: Content-Type
          in: header
          schema:
            type: string
          example: application/json
        - name: source
          in: path
          schema:
            type: string
          required: true
        - name: recordId
          in: path
          schema:
            type: string
          required: true
      responses:
        '200':
          description: "OK"
          content:
            application/json:
              example: {"id": "64cae4a66bf894c4e3c12074", "linked": true}
        '409':
          description: "Conflict"
          content:
            application/json:
              example: {"message": "This relationship has no free slots. Review its linked records in the entry editor."}
