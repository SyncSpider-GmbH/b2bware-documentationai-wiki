        Removes an optional association if the actor has unlink access. Required
        fields retain at least one target.
      requestBody:
        content:
          application/json:
            schema:
              type: object
              example:
                type: product-guides
                field: related_product
                entry: 64cae4a66bf894c4e3c12074
      parameters:
        - name: Content-Type
          in: header
          schema:
            type: string
