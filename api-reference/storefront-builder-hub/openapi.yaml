  /api/v1/apps/storefront-builder-hub/content-types:
    get:
      tags:
        - Content relationships
      summary: Filter content types by linked target type
      description: >-
        Filters readable content types by a visible registered source before
        pagination. Send a JSON array of equality conditions with value set to a
        registered source code. Supports the content types search parameter. Set
        include_entry_counts=1 to include permission-scoped counts of active
        entries.
      parameters:
        - name: filter[linked_target_type]
          in: query
          schema:
            type: string
          example: '[{"condition":"=","value":"product","operator":"AND"}]'
        - name: page
          in: query
          schema:
            type: integer
          example: '1'
        - name: per_page
          in: query
          schema:
            type: integer
          example: '25'
        - name: include_entry_counts
          in: query
          schema:
            type: integer
          example: '1'
      responses:
        '200':
          description: Successful response
          content:
            application/json: {}
    post:
      tags:
        - Content relationships
      summary: Create content type
      description: >-
        Creates a Content Type and returns the initial field schema revision. A
        relationship can omit code and label on creation. Existing codes and
        custom labels stay stable. In each relationship config, use
        unique_target to allow only one active entry per target,
        admin_display=compact|full, and inline_edit for record-panel editing.
        Separate nullable edit_role_ids, link_role_ids and unlink_role_ids
        provide optional restrictions. Null inherits normal permission, an empty
        list is Desk-only, and a populated list is limited to the chosen tenant
        roles plus Desk.
      requestBody:
        content:
          application/json:
            schema:
              type: object
              example:
                singular_label: Guide
                plural_label: Product guides
                slug: product-guides
                fields_json: []
      parameters:
        - name: Content-Type
          in: header
          schema:
            type: string
          example: application/json
      responses:
        '201':
          description: "Created"
          content:
            application/json:
              example: {"id": 1, "slug": "product-guides", "fields_json": [], "fields_revision": "aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa"}
  /api/v1/apps/storefront-builder-hub/content-types/{contentTypeId}:
    get:
      tags:
        - Content relationships
      summary: Get content type
      description: Returns the readable Content Type and its current field schema revision.
      parameters:
        - name: contentTypeId
          in: path
          schema:
            type: string
          required: true
      responses:
        '200':
          description: "OK"
          content:
            application/json:
              example: {"id": 1, "slug": "product-guides", "fields_json": [], "fields_revision": "aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa"}
        '404':
          description: "Not Found"
          content:
            application/json:
              example: {"message": "Content type not found"}
    put:
      tags:
        - Content relationships
      summary: Update content type
      description: >-
        When updating fields, send fields_revision from the previous response. A
        stale revision returns 409. Older integrations may omit the revision. A
        relationship can omit code and label on creation. Existing codes and
        custom labels stay stable. In each relationship config, use
        unique_target to allow only one active entry per target,
        admin_display=compact|full, and inline_edit for record-panel editing.
        Separate nullable edit_role_ids, link_role_ids and unlink_role_ids
        provide optional restrictions. Null inherits normal permission, an empty
        list is Desk-only, and a populated list is limited to the chosen tenant
        roles plus Desk.
      requestBody:
        content:
          application/json:
            schema:
              type: object
              example:
                fields_revision: >-
                  aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa
                fields_json: []
      parameters:
        - name: Content-Type
          in: header
          schema:
            type: string
          example: application/json
        - name: contentTypeId
          in: path
          schema:
            type: string
          required: true
      responses:
        '200':
          description: "OK"
          content:
            application/json:
              example: {"id": 1, "slug": "product-guides", "fields_json": [], "fields_revision": "aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa"}
        '409':
          description: "Conflict"
          content:
            application/json:
              example: {"message": "The fields changed in another editor. Reload this content type and retry."}
        '422':
          description: "Unprocessable Entity"
          content:
            application/json:
              example: {"message": "The content type settings are invalid."}
  /api/v1/apps/storefront-builder-hub/content-types/{contentTypeId}/relationships/{field}/options:
